---
# CADMUS-CR-11 — step 2
# Wazuh all-in-one on the SIEM, Sysmon + Wazuh agent on the workstation.

- name: Wait until WinRM is reachable on every Windows host
  hosts: windows-hosts
  gather_facts: false
  tasks:
    - name: Wait for the WinRM listener to accept connections
      ansible.builtin.wait_for_connection:
        delay: 0
        sleep: 10
        timeout: 900

- name: Windows workstation — trainee access and RDP
  hosts: windows-hosts
  gather_facts: false
  vars:
    local_trainee_password: Password123!
  roles:
    - name: ansible-role-user-access-windows
      user_access_username: localadmin
      user_access_password: '{{ local_trainee_password }}'
      user_access_rdp: true
      user_access_admin: true

- name: SIEM — trainee access and Wazuh all-in-one
  hosts: linux-hosts
  become: true
  gather_facts: true
  vars:
    local_trainee_password: Password123!
    # Wazuh only accepts the symbols . * + ? -   ("!" is rejected)
    wazuh_admin_password: Analyst123.
  roles:
    - name: ansible-role-user-access
      user_access_username: localadmin
      user_access_password: '{{ local_trainee_password }}'
  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - apt-transport-https
          - tar
        state: present
        update_cache: true

    - name: Download the Wazuh installation assistant
      ansible.builtin.get_url:
        url: https://packages.wazuh.com/4.9/wazuh-install.sh
        dest: /root/wazuh-install.sh
        mode: "0750"

    - name: Run the Wazuh installation assistant (slow — around 17 minutes)
      ansible.builtin.command:
        cmd: /root/wazuh-install.sh -a -i
        creates: /var/ossec/bin/wazuh-control
      async: 2400
      poll: 30

    - name: Wait for the Wazuh dashboard to answer
      ansible.builtin.uri:
        url: https://localhost:443
        validate_certs: false
        status_code: [200, 302, 401]
      register: dashboard_up
      retries: 30
      delay: 20
      until: dashboard_up is succeeded

    - name: Pin the dashboard admin password to a known value
      ansible.builtin.command:
        cmd: >
          /usr/share/wazuh-indexer/plugins/opensearch-security/tools/wazuh-passwords-tool.sh
          -u admin -p {{ wazuh_admin_password }}
      register: pin_password
      changed_when: pin_password.rc == 0
      failed_when: false

    - name: Report the password pinning result
      ansible.builtin.debug:
        msg: "PIN PASSWORD rc={{ pin_password.rc }} :: {{ pin_password.stdout_lines | default([]) }}"

    - name: Report Wazuh component status
      ansible.builtin.command:
        cmd: /var/ossec/bin/wazuh-control status
      register: ossec_status
      changed_when: false
      failed_when: false

    - name: Show Wazuh component status
      ansible.builtin.debug:
        msg: "{{ ossec_status.stdout_lines }}"

    - name: Wait for the agent enrolment port to open
      ansible.builtin.wait_for:
        port: 1515
        host: 0.0.0.0
        timeout: 300

    - name: Report service states
      ansible.builtin.command:
        cmd: systemctl is-active wazuh-manager wazuh-indexer wazuh-dashboard
      register: wazuh_services
      changed_when: false
      failed_when: false

    - name: Show service states
      ansible.builtin.debug:
        msg: "WAZUH SERVICES: {{ wazuh_services.stdout_lines }}"

- name: Workstation — Sysmon and the Wazuh agent
  hosts: windows-hosts
  gather_facts: false
  vars:
    siem_ip: 10.0.0.3
    sysmon_dir: C:\Installs\Sysmon
    wazuh_agent_url: https://packages.wazuh.com/4.x/windows/wazuh-agent-4.9.2-1.msi
  tasks:

    # ------------------------------------------------------------------
    # Sysmon — endpoint telemetry (process creation, network connections)
    # ------------------------------------------------------------------
    - name: Ensure the Sysmon install directory exists
      ansible.windows.win_file:
        path: '{{ sysmon_dir }}'
        state: directory

    - name: Download Sysmon from Sysinternals
      ansible.windows.win_get_url:
        url: https://download.sysinternals.com/files/Sysmon.zip
        dest: '{{ sysmon_dir }}\Sysmon.zip'

    - name: Unzip Sysmon
      community.windows.win_unzip:
        src: '{{ sysmon_dir }}\Sysmon.zip'
        dest: '{{ sysmon_dir }}'

    - name: Download the SwiftOnSecurity Sysmon configuration
      ansible.windows.win_get_url:
        url: https://raw.githubusercontent.com/SwiftOnSecurity/sysmon-config/master/sysmonconfig-export.xml
        dest: '{{ sysmon_dir }}\sysmonconfig.xml'

    - name: Install Sysmon with that configuration
      ansible.windows.win_command:
        cmd: '{{ sysmon_dir }}\Sysmon64.exe -accepteula -i {{ sysmon_dir }}\sysmonconfig.xml'
      args:
        creates: C:\Windows\Sysmon64.exe
      register: sysmon_install
      failed_when: false

    - name: Report the Sysmon install result
      ansible.builtin.debug:
        msg: "SYSMON INSTALL rc={{ sysmon_install.rc | default('n/a') }} :: {{ sysmon_install.stdout_lines | default([]) }}"

    - name: Confirm the Sysmon service is running
      ansible.windows.win_service:
        name: Sysmon64
        state: started
        start_mode: auto

    # ------------------------------------------------------------------
    # Wazuh agent — ships Windows and Sysmon events to the manager
    # ------------------------------------------------------------------
    - name: Download the Wazuh agent installer
      ansible.windows.win_get_url:
        url: '{{ wazuh_agent_url }}'
        dest: C:\Installs\wazuh-agent.msi

    - name: Install and enrol the Wazuh agent
      ansible.windows.win_package:
        path: C:\Installs\wazuh-agent.msi
        arguments: /q WAZUH_MANAGER="{{ siem_ip }}" WAZUH_AGENT_NAME="WS01" WAZUH_REGISTRATION_SERVER="{{ siem_ip }}"
        state: present

    - name: Add the Sysmon channel to the agent configuration
      community.windows.win_lineinfile:
        path: C:\Program Files (x86)\ossec-agent\ossec.conf
        insertbefore: '</ossec_config>'
        line: |
          <localfile>
            <location>Microsoft-Windows-Sysmon/Operational</location>
            <log_format>eventchannel</log_format>
          </localfile>

    - name: Restart the Wazuh agent so it picks up the Sysmon channel
      ansible.windows.win_service:
        name: WazuhSvc
        state: restarted
        start_mode: auto

    - name: Give the agent a moment to enrol
      ansible.builtin.pause:
        seconds: 30

- name: Confirm the agent enrolled
  hosts: linux-hosts
  become: true
  gather_facts: false
  tasks:
    - name: List enrolled agents
      ansible.builtin.command:
        cmd: /var/ossec/bin/agent_control -l
      register: agent_list
      changed_when: false
      failed_when: false
      retries: 10
      delay: 15
      until: "'WS01' in agent_list.stdout"

    - name: Show enrolled agents
      ansible.builtin.debug:
        msg: "AGENTS: {{ agent_list.stdout_lines }}"
