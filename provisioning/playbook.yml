---
# CADMUS-CR-11 — rung 1
# Wazuh all-in-one on the SIEM, plus trainee access to both hosts.

- name: Wait until WinRM is reachable on every Windows host
  hosts: windows-hosts
  gather_facts: false
  tasks:
    - name: Wait for the WinRM listener to accept connections
      ansible.builtin.wait_for_connection:
        delay: 0
        sleep: 10
        timeout: 900

- name: Windows workstation — trainee access and RDP
  hosts: windows-hosts
  gather_facts: false
  vars:
    local_trainee_password: Password123!
  roles:
    - name: ansible-role-user-access-windows
      user_access_username: localadmin
      user_access_password: '{{ local_trainee_password }}'
      user_access_rdp: true
      user_access_admin: true

- name: SIEM — trainee access and Wazuh all-in-one
  hosts: linux-hosts
  become: true
  gather_facts: true
  vars:
    local_trainee_password: Password123!
    wazuh_admin_password: Analyst123!
  roles:
    - name: ansible-role-user-access
      user_access_username: localadmin
      user_access_password: '{{ local_trainee_password }}'
  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - apt-transport-https
          - tar
        state: present
        update_cache: true

    - name: Download the Wazuh installation assistant
      ansible.builtin.get_url:
        url: https://packages.wazuh.com/4.9/wazuh-install.sh
        dest: /root/wazuh-install.sh
        mode: "0750"

    - name: Run the Wazuh installation assistant (slow — around 16 minutes)
      ansible.builtin.command:
        cmd: /root/wazuh-install.sh -a -i
        creates: /var/ossec/bin/wazuh-control
      async: 2400
      poll: 30

    - name: Wait for the Wazuh dashboard to answer
      ansible.builtin.uri:
        url: https://localhost:443
        validate_certs: false
        status_code: [200, 302, 401]
      register: dashboard_up
      retries: 30
      delay: 20
      until: dashboard_up is succeeded

    - name: Locate the Wazuh password tool
      ansible.builtin.find:
        paths:
          - /usr/share/wazuh-indexer
          - /var/ossec
        patterns: "wazuh-passwords-tool.sh"
        recurse: true
      register: pw_tool

    - name: Report where the password tool lives
      ansible.builtin.debug:
        msg: "PASSWORD TOOL: {{ pw_tool.files | map(attribute='path') | list }}"

    - name: Pin the dashboard admin password to a known value
      ansible.builtin.command:
        cmd: "{{ (pw_tool.files | first).path }} -u admin -p {{ wazuh_admin_password }}"
      register: pin_password
      changed_when: pin_password.rc == 0
      failed_when: false
      when: pw_tool.files | length > 0

    - name: Report the password pinning result
      ansible.builtin.debug:
        msg: >-
          PIN PASSWORD rc={{ pin_password.rc | default('skipped') }} ::
          {{ pin_password.stdout_lines | default([]) }} ::
          {{ pin_password.stderr_lines | default([]) }}

    - name: Report service states
      ansible.builtin.command:
        cmd: systemctl is-active wazuh-manager wazuh-indexer wazuh-dashboard
      register: wazuh_services
      changed_when: false
      failed_when: false

    - name: Show service states
      ansible.builtin.debug:
        msg: "WAZUH SERVICES: {{ wazuh_services.stdout_lines }}"

- name: Confirm the Windows host can reach the SIEM
  hosts: windows-hosts
  gather_facts: false
  tasks:
    - name: Request the dashboard login page from the Windows host
      ansible.windows.win_uri:
        url: https://10.0.0.3:443
        validate_certs: false
        status_code: [200, 302, 401]
      register: ws_to_siem
      ignore_errors: true

    - name: Report WS to SIEM connectivity
      ansible.builtin.debug:
        msg: "WS -> SIEM: {{ 'OK' if ws_to_siem is succeeded else 'BLOCKED' }}"
