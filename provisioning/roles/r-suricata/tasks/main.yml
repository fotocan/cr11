---
# Network sensor on the router.
#
# The router must be ubuntu-noble: Debian 12's mirror on this platform offers
# only a backports Suricata with an unsatisfiable libhtp2 dependency, and no
# Zeek at all. Ubuntu's noble/universe has a clean 7.0.3 build.

- name: Install Suricata and tcpdump
  ansible.builtin.apt:
    name:
      - suricata
      - tcpdump
    state: present
    update_cache: true

- name: Verify Suricata installed
  ansible.builtin.shell: suricata -V 2>/dev/null || echo "NOT INSTALLED"
  register: suricata_version
  changed_when: false

- name: Report the Suricata version
  ansible.builtin.debug:
    msg: "SURICATA VERSION: {{ suricata_version.stdout | trim }}"

- name: Listen on the corporate interface rather than eth0
  ansible.builtin.replace:
    path: /etc/suricata/suricata.yaml
    regexp: '^(\s*-\s*interface:\s*)eth0\s*$'
    replace: '\1ens5'

- name: Treat the corporate network as HOME_NET
  ansible.builtin.replace:
    path: /etc/suricata/suricata.yaml
    regexp: '^(\s*HOME_NET:\s*).*$'
    replace: '\1"[10.0.0.0/24]"'

- name: Enable and start Suricata
  ansible.builtin.systemd:
    name: suricata
    enabled: true
    state: restarted

- name: Give it time to come up
  ansible.builtin.pause:
    seconds: 20

- name: Check the service state and that eve.json is being written
  ansible.builtin.shell: |
    systemctl is-active suricata
    wc -l /var/log/suricata/eve.json 2>/dev/null || echo "no eve.json"
  register: suricata_state
  changed_when: false
  failed_when: false

- name: Report the Suricata state
  ansible.builtin.debug:
    msg: "SURICATA STATE: {{ suricata_state.stdout_lines }}"

# ------------------------------------------------------------------
# Ship eve.json to the SIEM so network evidence sits alongside the
# endpoint telemetry rather than somewhere trainees must remember to look.
# ------------------------------------------------------------------

- name: Add the Wazuh agent repository
  ansible.builtin.shell: |
    curl -s https://packages.wazuh.com/key/GPG-KEY-WAZUH |
      gpg --no-default-keyring --keyring gnupg-ring:/usr/share/keyrings/wazuh.gpg --import
    chmod 644 /usr/share/keyrings/wazuh.gpg
    echo "deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main" > /etc/apt/sources.list.d/wazuh.list
  args:
    creates: /etc/apt/sources.list.d/wazuh.list

# Pin to the manager's version. The apt repo serves the newest agent, and
# Wazuh refuses to enrol an agent newer than its manager — which fails with
# "Agent version must be lower or equal to manager version". The SIEM runs
# 4.9.2 because wazuh-install.sh is fetched from the 4.9 branch.
- name: Install the Wazuh agent, pinned to the manager's version
  ansible.builtin.apt:
    name: wazuh-agent=4.9.2-1
    state: present
    update_cache: true
    allow_downgrade: true

# The deb package reads WAZUH_MANAGER from the environment during its
# post-install script, but those variables do not survive Ansible's apt
# module — the agent installs, runs, and never enrols. Write the address
# into ossec.conf instead.
- name: Point the agent at the manager
  ansible.builtin.replace:
    path: /var/ossec/etc/ossec.conf
    regexp: '<address>[^<]*</address>'
    replace: '<address>10.0.0.3</address>'

# Do not add <agent_name> here — it is only valid inside <enrollment>, and
# putting it in <server> makes ossec.conf invalid so the agent will not start.
# Without it the agent enrols under its hostname, r-corp, which is fine.

- name: Tell the agent to read eve.json
  ansible.builtin.blockinfile:
    path: /var/ossec/etc/ossec.conf
    insertbefore: '</ossec_config>'
    marker: '<!-- {mark} cr11 suricata -->'
    block: |
      <localfile>
        <log_format>json</log_format>
        <location>/var/log/suricata/eve.json</location>
      </localfile>

- name: Enable and start the Wazuh agent
  ansible.builtin.systemd:
    name: wazuh-agent
    enabled: true
    state: restarted
    daemon_reload: true

- name: Give the agent time to enrol
  ansible.builtin.pause:
    seconds: 30

- name: Read back the agent state and its enrolment
  ansible.builtin.shell: |
    systemctl is-active wazuh-agent
    grep -o '<address>[^<]*</address>' /var/ossec/etc/ossec.conf | head -1
    tail -5 /var/ossec/logs/ossec.log
  register: agent_state
  changed_when: false
  failed_when: false

- name: Show the agent state
  ansible.builtin.debug:
    msg: "ROUTER AGENT: {{ agent_state.stdout_lines }}"
