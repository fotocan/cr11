---
# C2 — lateral movement from WS01 to DC01 using the compromised service
# account. A real authentication, not a staged log line: it produces a
# genuine 4624 logon type 3 on DC01 with svc-backup as targetUserName and
# 10.0.0.4 as the source address.
#
# Connect to SYSVOL rather than C$: any authenticated domain user can read
# SYSVOL, whereas C$ is restricted to local Administrators and svc-backup is
# only in Backup Operators. The attempt against NTDS is deliberate — it
# fails, and a failed access to the AD database is itself good evidence.
#
# The credentials are written to a script and read from there rather than
# passed on the command line. An inline `net use \\host\share /user:x password`
# is realistic — attackers and administrators both do it — but Sysmon records
# the whole command line, which would hand trainees a working domain password
# and collapse the level into a single event. The correlation between the
# endpoint process and the domain controller logon is the exercise.

- name: Ensure the staging directory exists
  ansible.windows.win_file:
    path: C:\Staging
    state: directory

- name: Write the connector script
  ansible.windows.win_copy:
    dest: C:\Staging\bkpconn.ps1
    content: |
      # The credential is constructed inside the script rather than passed on a
      # command line. net.exe is its own process, so `net use ... <password>`
      # puts the secret in NET.EXE's recorded command line even when the caller
      # is a script — moving it into the script only pushes the exposure down a
      # level. `net use ... *` reads from the console rather than stdin, so
      # piping does not work either. Building a PSCredential keeps the secret
      # in the script body, which Sysmon event 1 does not record.
      $p = ConvertTo-SecureString '{{ lateral_password }}' -AsPlainText -Force
      $c = New-Object System.Management.Automation.PSCredential('{{ lateral_domain }}\{{ lateral_user }}', $p)
      New-PSDrive -Name X -PSProvider FileSystem -Root '\\{{ lateral_target }}\SYSVOL' -Credential $c | Out-Null
      Get-ChildItem X:\ | Out-String
      Get-ChildItem '\\{{ lateral_target }}\C$\Windows\NTDS' -ErrorAction SilentlyContinue | Out-String
      Remove-PSDrive -Name X

- name: Register a scheduled task that performs the lateral movement
  community.windows.win_scheduled_task:
    name: BackupJobConnector
    description: Staged C2 artefact
    actions:
      - path: C:\Windows\System32\cmd.exe
        arguments: '/c powershell -nop -ExecutionPolicy Bypass -File C:\Staging\bkpconn.ps1 > C:\Staging\c2.log 2>&1'
    triggers:
      - type: registration
    username: SYSTEM
    run_level: highest
    state: present
    enabled: true

- name: Give the task time to run
  ansible.builtin.pause:
    seconds: 45

- name: Remove the scheduled task
  community.windows.win_scheduled_task:
    name: BackupJobConnector
    state: absent

# Remove the script once it has run. The connection happened and is recorded
# on the domain controller; leaving the credentials on disk would be the same
# problem in a different place.
- name: Remove the connector script
  ansible.windows.win_file:
    path: C:\Staging\bkpconn.ps1
    state: absent

- name: Read what the lateral movement actually did
  ansible.windows.win_shell: Get-Content C:\Staging\c2.log
  register: c2_log
  changed_when: false
  failed_when: false

- name: Report the lateral movement result
  ansible.builtin.debug:
    msg: "C2 LOG: {{ c2_log.stdout_lines | default(['no log produced']) }}"

- name: Confirm the password is not in any recorded command line
  ansible.windows.win_shell: |
    $e = Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-Sysmon/Operational'; Id=1} -MaxEvents 300 -ErrorAction SilentlyContinue
    ($e | Where-Object { $_.Message -match 'Password123' }).Count
  register: cred_leak
  changed_when: false
  failed_when: false

- name: Report the credential exposure check
  ansible.builtin.debug:
    msg: "CREDS IN COMMAND LINES: {{ cred_leak.stdout | default('?') | trim }} (must be 0)"
