---
- name: Ensure the payload directory exists
  ansible.windows.win_file:
    path: '{{ payload_dir }}'
    state: directory

# The payload is not a working executable — it only needs to look like one to
# static triage: a valid PE header so `file` identifies it, printable strings
# a trainee can extract, and the marker that is B3's answer.
- name: Build the staged payload
  ansible.windows.win_shell: |
    $dest = '{{ payload_file }}'
    # Start from a real PE so the header, sections and file type are genuine
    Copy-Item 'C:\Windows\System32\calc.exe' -Destination $dest -Force
    $strings = @(
      'CDMS-b7f3a91e-STAGE2'
      'updates-cdn-delivery.invalid'
      'POST /gate.php HTTP/1.1'
      'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'
      'SOFTWARE\Microsoft\Windows\CurrentVersion\Run'
      'beacon_interval=60'
    ) -join "`0"
    $bytes = [System.Text.Encoding]::ASCII.GetBytes($strings)
    $fs = [System.IO.File]::Open($dest, 'Append', 'Write')
    $fs.Write($bytes, 0, $bytes.Length)
    $fs.Close()
    (Get-FileHash $dest -Algorithm SHA256).Hash
  register: payload_built
  changed_when: true
  failed_when: false

- name: Report the payload build result
  ansible.builtin.debug:
    msg: >-
      B3 PAYLOAD SHA256: {{ payload_built.stdout | default('') | trim }}
      {{ ':: STDERR ' ~ (payload_built.stderr | default('') | trim) if (payload_built.stderr | default('') | trim) else '' }}

- name: Confirm the payload survived on disk
  ansible.windows.win_stat:
    path: '{{ payload_file }}'
  register: payload_stat

- name: Report whether the payload is present
  ansible.builtin.debug:
    msg: >-
      B3 PAYLOAD ON DISK: {{ 'yes, ' ~ payload_stat.stat.size ~ ' bytes'
      if payload_stat.stat.exists else 'NO — quarantined or never written' }}

- name: Confirm the marker is extractable
  ansible.windows.win_shell: >-
    Select-String -Path '{{ payload_file }}' -Pattern 'CDMS-[0-9a-f]{8}-STAGE2'
    -Encoding ascii -AllMatches |
    ForEach-Object { $_.Matches.Value } | Select-Object -First 1
  register: marker_check
  changed_when: false
  failed_when: false

- name: Report the extracted marker
  ansible.builtin.debug:
    msg: "B3 MARKER: {{ marker_check.stdout | default('NOT FOUND') | trim }}"

# ------------------------------------------------------------------
# Persistence — two mechanisms, as real intrusions usually have.
# ------------------------------------------------------------------

- name: Load j.novak's registry hive so HKCU persistence can be written
  ansible.windows.win_shell: |
    $sid = (New-Object System.Security.Principal.NTAccount('CORP','{{ payload_user }}')).Translate([System.Security.Principal.SecurityIdentifier]).Value
    if (-not (Test-Path "Registry::HKEY_USERS\$sid")) {
      reg load "HKU\$sid" "C:\Users\{{ payload_user }}\NTUSER.DAT" | Out-Null
    }
    $sid
  register: novak_sid
  changed_when: false
  failed_when: false

- name: Report the resolved SID
  ansible.builtin.debug:
    msg: "J.NOVAK SID: {{ novak_sid.stdout | default('unresolved') | trim }}"

- name: Write the Run key persistence
  ansible.windows.win_regedit:
    path: 'HKU:\{{ novak_sid.stdout | trim }}\Software\Microsoft\Windows\CurrentVersion\Run'
    name: '{{ run_key_name }}'
    data: '"{{ payload_file }}"'
    type: string
  register: run_key
  failed_when: false

- name: Fall back to the local machine Run key if the user hive is unavailable
  ansible.windows.win_regedit:
    path: 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Run'
    name: '{{ run_key_name }}'
    data: '"{{ payload_file }}"'
    type: string
  when: run_key is failed

- name: Read back the Run key entries
  ansible.windows.win_shell: >-
    "$s = '{{ novak_sid.stdout | trim }}';
     (Get-ItemProperty \"Registry::HKEY_USERS\$s\Software\Microsoft\Windows\CurrentVersion\Run\"
     -ErrorAction SilentlyContinue).'{{ run_key_name }}'"
  register: run_key_check
  changed_when: false
  failed_when: false

- name: Report the Run key persistence
  ansible.builtin.debug:
    msg: "PERSISTENCE RUN KEY: {{ run_key_check.stdout_lines | default([]) | select | list }}"

# A scheduled task named to blend in with genuine Microsoft update tasks.
- name: Create the scheduled task persistence
  community.windows.win_scheduled_task:
    name: '{{ persist_task_name }}'
    description: Keeps Microsoft software up to date.
    actions:
      - path: '{{ payload_file }}'
    triggers:
      - type: logon
    username: SYSTEM
    run_level: highest
    state: present
    enabled: true

- name: Read back the persistence task
  ansible.windows.win_shell: >-
    Get-ScheduledTask -TaskName '{{ persist_task_name }}' |
    Select-Object TaskName, State | Format-List | Out-String
  register: persist_task_check
  changed_when: false
  failed_when: false

- name: Report the scheduled task persistence
  ansible.builtin.debug:
    msg: "PERSISTENCE TASK: {{ persist_task_check.stdout_lines | default([]) | select | list }}"
