# C1 — credential access.
#
# The backup service on WS01 runs as CORP\svc-backup, which is why that
# account's credentials are resident in LSASS memory and therefore stealable.
# This is what links C1 (theft) to C2 (use of the stolen account) — without
# it, a trainee can see that memory was read but not what came out of it.
cred_service_name: BackupAgentSvc
cred_service_account: CORP\svc-backup
cred_service_password: Password123!
