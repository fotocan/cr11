---
# Defender handling.
#
# Tamper Protection is enabled on the windows-11 image, so real-time
# protection cannot be disabled programmatically — do not try. Path
# exclusions are usually still modifiable by a local administrator on an
# unmanaged device, and they are all we need: the staged payload is a benign
# marker file Defender has no reason to flag, but C1's credential-access
# activity is behaviour Defender does detect.
#
# The exclusions are scenario material too. E1 asks trainees to notice that a
# scan comes back clean because the payload's location is excluded, remove
# the exclusion, and scan again.

- name: Add scenario paths to the Defender exclusion list
  ansible.windows.win_shell: Add-MpPreference -ExclusionPath '{{ item }}'
  loop:
    - 'C:\Installs'
    - 'C:\Program Files\Microsoft Office'
    - 'C:\Users\localadmin\AppData\Roaming\Microsoft'
    - 'C:\Staging'
  changed_when: false
  failed_when: false

- name: Read back the Defender exclusion list
  ansible.windows.win_shell: (Get-MpPreference).ExclusionPath -join ' ; '
  register: defender_exclusions
  changed_when: false
  failed_when: false

- name: Read back the Defender protection state
  ansible.windows.win_shell: >-
    Get-MpComputerStatus |
    Select-Object -ExpandProperty IsTamperProtected
  register: defender_tamper
  changed_when: false
  failed_when: false

- name: Report the Defender state
  ansible.builtin.debug:
    msg: >-
      DEFENDER on {{ inventory_hostname }}:
      Tamper={{ defender_tamper.stdout | default('?') | trim }}
      Exclusions=[{{ defender_exclusions.stdout | default('') | trim }}]
