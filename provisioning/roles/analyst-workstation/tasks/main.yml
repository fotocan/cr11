---
# The analyst workstation — where trainees actually work.
#
# Reachable via Open GUI (XFCE, lightdm). Everything installed here has a home
# in a specific level; the aim is a working analyst desktop, not a furnished
# one. Each tool is noted with the level that uses it.

- name: Install the triage toolset
  ansible.builtin.apt:
    name:
      - wireshark          # D2 — packet analysis of the beacon traffic
      - tshark
      - tcpdump
      - jq                 # parsing Suricata eve.json and Chainsaw output
      - xxd                # B3 — inspecting the payload
      - binutils           # provides strings, B3's marker extraction
      - file               # B3 — identifying the payload as a PE
      - unzip
      - curl
      - python3-pip
    state: present
    update_cache: true

- name: Let localadmin capture packets without root
  ansible.builtin.shell: |
    groupadd -f wireshark
    usermod -aG wireshark localadmin
    dpkg-reconfigure -f noninteractive wireshark-common
    chgrp wireshark /usr/bin/dumpcap
    chmod 750 /usr/bin/dumpcap
    setcap cap_net_raw,cap_net_admin+eip /usr/bin/dumpcap
  changed_when: true
  failed_when: false

# ------------------------------------------------------------------
# Chainsaw — B2. Lets trainees hunt raw EVTX with Sigma rules, which is
# what you do when a host is not forwarding to the SIEM. It also gives a
# second detection opinion to compare against Wazuh's.
# ------------------------------------------------------------------
- name: Fetch Chainsaw with its rules and the Sigma ruleset
  ansible.builtin.unarchive:
    src: https://github.com/WithSecureLabs/chainsaw/releases/download/v2.9.1/chainsaw_all_platforms+rules.zip
    dest: /opt
    remote_src: true
  register: chainsaw_fetch
  failed_when: false

- name: Make the Chainsaw binary executable and reachable on PATH
  ansible.builtin.shell: |
    BIN=$(find /opt -name "chainsaw_x86_64-unknown-linux-gnu" -type f | head -1)
    if [ -n "$BIN" ]; then
      chmod +x "$BIN"
      ln -sf "$BIN" /usr/local/bin/chainsaw
      echo "$BIN"
    else
      echo "NOT FOUND"
    fi
  register: chainsaw_link
  changed_when: true

- name: Report Chainsaw
  ansible.builtin.debug:
    msg: "CHAINSAW: {{ chainsaw_link.stdout | trim }}"

# ------------------------------------------------------------------
# Analyst working files. These exist because objectives 3 and 6 currently
# have no supporting infrastructure — trainees need somewhere to record a
# timeline and somewhere to write findings, or both become memory exercises.
# ------------------------------------------------------------------
- name: Create the analyst working directory
  ansible.builtin.file:
    path: /home/localadmin/Desktop
    state: directory
    owner: localadmin
    group: localadmin
    mode: "0755"

- name: Install the incident report template
  ansible.builtin.copy:
    src: incident-report.md
    dest: /home/localadmin/Desktop/incident-report.md
    owner: localadmin
    group: localadmin
    mode: "0644"

- name: Install the timeline skeleton
  ansible.builtin.copy:
    src: timeline.csv
    dest: /home/localadmin/Desktop/timeline.csv
    owner: localadmin
    group: localadmin
    mode: "0644"

- name: Create the threat intelligence directory
  ansible.builtin.file:
    path: /home/localadmin/Desktop/threat-intel
    state: directory
    owner: localadmin
    group: localadmin
    mode: "0755"

- name: Install the offline threat intelligence set
  ansible.builtin.copy:
    src: '{{ item }}'
    dest: '/home/localadmin/Desktop/threat-intel/{{ item }}'
    owner: localadmin
    group: localadmin
    mode: "0644"
  loop:
    - intel-cdms-loader.md
    - intel-indicators.json

# ------------------------------------------------------------------
# Pull the artefacts staged elsewhere onto the analyst's desktop, so the
# levels can say "open this file" rather than "go and find it".
# ------------------------------------------------------------------
- name: Create the evidence directory
  ansible.builtin.file:
    path: /home/localadmin/Desktop/evidence
    state: directory
    owner: localadmin
    group: localadmin
    mode: "0755"

- name: Install the SMB client so the Windows exports can be fetched
  ansible.builtin.apt:
    name: smbclient
    state: present

- name: Wait for the router capture to finish, then fetch the PCAP
  ansible.builtin.get_url:
    url: http://10.0.0.1:8080/incident-window.pcap
    dest: /home/localadmin/Desktop/evidence/incident-window.pcap
    owner: localadmin
    group: localadmin
    mode: "0644"
  register: pcap_fetch
  retries: 20
  delay: 30
  until: pcap_fetch is succeeded
  failed_when: false

- name: Fetch the Windows event log exports
  ansible.builtin.shell: |
    smbclient //10.0.0.4/Exports -N -c "prompt OFF; lcd /home/localadmin/Desktop/evidence; mget *.evtx" 2>&1 | tail -5
    chown localadmin:localadmin /home/localadmin/Desktop/evidence/*.evtx 2>/dev/null || true
    ls -la /home/localadmin/Desktop/evidence/
  register: evtx_fetch
  changed_when: true
  failed_when: false

- name: Report the evidence collected
  ansible.builtin.debug:
    msg: "EVIDENCE: {{ evtx_fetch.stdout_lines | default([]) }}"

- name: Verify the toolset
  ansible.builtin.shell: |
    for t in tshark tcpdump jq xxd strings file chainsaw; do
      printf "%-10s %s\n" "$t" "$(command -v $t || echo MISSING)"
    done
    echo "--- desktop files"
    ls -1 /home/localadmin/Desktop/
  register: analyst_check
  changed_when: false

- name: Report the analyst workstation state
  ansible.builtin.debug:
    msg: "ANALYST READY: {{ analyst_check.stdout_lines }}"
