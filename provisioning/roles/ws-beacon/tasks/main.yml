---
- name: Ensure the beacon script directory exists
  ansible.windows.win_file:
    path: 'C:\Users\Public\Libraries'
    state: directory

- name: Write the beacon script
  ansible.windows.win_copy:
    dest: '{{ beacon_script }}'
    content: |
      $ErrorActionPreference = 'SilentlyContinue'
      Resolve-DnsName -Name '{{ beacon_domain }}' -Type A | Out-Null

- name: Register the beacon as a repeating scheduled task
  community.windows.win_scheduled_task:
    name: '{{ beacon_task_name }}'
    description: Microsoft Edge update check.
    actions:
      - path: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        arguments: >-
          -nop -w hidden -ExecutionPolicy Bypass
          -File {{ beacon_script }}
    triggers:
      - type: daily
        start_boundary: '2026-01-01T00:00:00'
        repetition:
          interval: PT{{ beacon_interval_minutes }}M
          duration: P1D
    username: SYSTEM
    run_level: highest
    state: present
    enabled: true

- name: Run it once immediately so there is evidence straight away
  ansible.windows.win_shell: Start-ScheduledTask -TaskName '{{ beacon_task_name }}'
  changed_when: true

- name: Wait for two beacon cycles
  ansible.builtin.pause:
    seconds: 150

- name: Count the beacon DNS queries Sysmon recorded
  ansible.windows.win_shell: |
    $e = Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-Sysmon/Operational'; Id=22} -MaxEvents 50 -ErrorAction SilentlyContinue
    ($e | Where-Object { $_.Message -match '{{ beacon_domain }}' }).Count
  register: beacon_count
  changed_when: false
  failed_when: false

- name: Report the beacon activity
  ansible.builtin.debug:
    msg: "BEACON QUERIES SEEN: {{ beacon_count.stdout | default('0') | trim }}"

- name: Confirm the task is registered, runs, and executes what we expect
  ansible.windows.win_shell: |
    $t = Get-ScheduledTask -TaskName '{{ beacon_task_name }}' -ErrorAction SilentlyContinue
    if (-not $t) { "NOT PRESENT"; exit }
    $i = Get-ScheduledTaskInfo -TaskName '{{ beacon_task_name }}'
    "State=$($t.State) LastResult=$($i.LastTaskResult) NextRun=$($i.NextRunTime) Exec=$($t.Actions.Execute)"
  register: beacon_task
  changed_when: false
  failed_when: false

- name: Report the beacon task state
  ansible.builtin.debug:
    msg: "BEACON TASK: {{ beacon_task.stdout_lines | default([]) | select | list }}"

# ------------------------------------------------------------------
# B2 — export the Sysmon log so Chainsaw on the analyst workstation has an
# EVTX to hunt through. Exporting it here rather than making trainees do it
# saves a twenty-minute file-transfer detour that teaches nothing, and it
# mirrors reality: an analyst is usually handed an export.
#
# This runs last in the play, after every artefact has fired, so the export
# contains the whole incident.
# ------------------------------------------------------------------

- name: Create the export directory
  ansible.windows.win_file:
    path: 'C:\Exports'
    state: directory

- name: Export the Sysmon operational log
  ansible.windows.win_shell: |
    $dest = 'C:\Exports\WS01-Sysmon.evtx'
    if (Test-Path $dest) { Remove-Item $dest -Force }
    wevtutil epl "Microsoft-Windows-Sysmon/Operational" $dest
    $s = (Get-Item $dest).Length
    "exported $dest ($s bytes)"
  register: evtx_export
  changed_when: true
  failed_when: false

- name: Export the Security log as well
  ansible.windows.win_shell: |
    $dest = 'C:\Exports\WS01-Security.evtx'
    if (Test-Path $dest) { Remove-Item $dest -Force }
    wevtutil epl Security $dest
    $s = (Get-Item $dest).Length
    "exported $dest ($s bytes)"
  register: sec_export
  changed_when: true
  failed_when: false

- name: Share the exports read-only so the analyst workstation can reach them
  ansible.windows.win_shell: |
    if (-not (Get-SmbShare -Name Exports -ErrorAction SilentlyContinue)) {
      New-SmbShare -Name Exports -Path 'C:\Exports' -ReadAccess 'Everyone' | Out-Null
    }
    Get-SmbShare -Name Exports | Select-Object Name,Path | Format-List | Out-String
  register: share_state
  changed_when: true
  failed_when: false

- name: Report the EVTX exports
  ansible.builtin.debug:
    msg: >-
      EVTX EXPORTS: {{ evtx_export.stdout | default('') | trim }} ::
      {{ sec_export.stdout | default('') | trim }} ::
      share {{ 'created' if share_state is succeeded else 'FAILED' }}
