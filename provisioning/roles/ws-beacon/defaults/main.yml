---
# D1 and D2 — the C2 beacon.
#
# No real command-and-control server exists. The implant is a scheduled task
# that resolves an unregistered domain at a fixed interval. The DNS query is
# genuine, crosses the router, and is recorded by both Sysmon (event ID 22)
# and Suricata — but nothing ever answers it.
#
# The TLD is .corp, not .invalid. ICANN reserved .corp permanently from
# delegation so it can never resolve publicly, which gives the same safety
# guarantee — but Windows DNS refuses to host a zone for any .invalid name
# (WIN32 123, ERROR_INVALID_NAME), and E1 needs trainees to be able to
# sinkhole this domain on DC01. With .corp they can, and the effect is
# visible: queries change from NXDOMAIN to 127.0.0.1 in Sysmon and stop
# leaving the network in Suricata.
#
# The fixed interval is the point: trainees identify beaconing by periodicity,
# not by the domain looking suspicious.
beacon_domain: updates-cdn-delivery.corp
beacon_interval_minutes: 2
# See ws-payload/defaults for why this is not MicrosoftEdgeUpdateTaskMachineCore.
beacon_task_name: EdgeContentDeliveryTask
beacon_script: 'C:\Users\Public\Libraries\netmon.ps1'
