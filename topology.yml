name: proba-sandbox
hosts:
  - name: proba-lin
    flavor: standard.small
    base_box:
      image: ubuntu-noble-x86_64
      mgmt_user: ubuntu
      mgmt_protocol: ssh
    hidden: false
  - name: proba-win
    flavor: c4_r5_d50
    base_box:
      image: windows-11-x86_64
      mgmt_user: windows
    hidden: false
routers:
  - name: proba-router
    flavor: c1_r2_d10
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
      mgmt_protocol: ssh
    hidden: false
networks:
  - name: proba-net
    cidr: 10.0.0.0/24
    accessible_by_user: true
    hidden: false
wan:
  name: internet-connection
  cidr: 100.100.100.0/24
net_mappings:
  - host: proba-lin
    network: proba-net
    ip: 10.0.0.3
  - host: proba-win
    network: proba-net
    ip: 10.0.0.4
router_mappings:
  - router: proba-router
    network: proba-net
    ip: 10.0.0.1
groups:
  - name: linux-hosts
    nodes:
      - proba-lin
  - name: windows-hosts
    nodes:
      - proba-win
